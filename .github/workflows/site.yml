# 构建与检查（源码仓库 Whatasiger/Whatasiger.XYZ）
#
# - 推送到 main / 提 PR：完整构建（Glint + Origin + 压缩），再跑 tools/check-site.js（站内链接、页面体积、图片格式、一叶关卡）
# - 手动运行（Actions 页面 Run workflow）：可勾选「部署」
# - 每天刷新网易云周榜另见 todo.yml（只替换线上的 /todo.json，不在这里定时整站重建部署：
#   源码仓库常落后于已部署的站点，定时部署会把线上改回旧版）
#
# 部署默认关闭，只在手动运行并勾选 deploy 时发生，且须先在仓库 Settings → Secrets 配好
# DEPLOY_TOKEN：对 Whatasiger/Whatasiger.github.io 有 Contents 读写权限的 fine-grained token
# 部署前确认源码仓库已是线上那一版（npm run source:publish 过），否则同样会回滚
# 部署方式与 hexo-deployer-git 等价：把 public/ 的内容提交到 Whatasiger.github.io 的 main（保留其提交历史，不强推）

name: 构建与检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: '构建通过后部署到 Whatasiger.github.io'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      # 只把「有没有配 token」暴露给整个 job（供部署步骤的 if 判断）；token 本身只在部署那一步注入，安装依赖 / 构建 / 检查都读不到
      HAS_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（Glint + Origin + 压缩）
        run: npm run build

      - name: 检查站点
        run: node tools/check-site.js

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

      - name: 部署到 Whatasiger.github.io
        if: >-
          env.HAS_DEPLOY_TOKEN == 'true' && github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${DEPLOY_TOKEN}@github.com/Whatasiger/Whatasiger.github.io.git" deploy
          rsync -a --delete --exclude .git public/ deploy/
          cd deploy
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，不必部署"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Site updated: $(date '+%Y-%m-%d %H:%M:%S')（${{ github.event_name }}）"
          git push origin HEAD:main
