# 首页 TO DO 侧边栏（左侧抽屉）
# Bangumi 在浏览器端实时拉取；网易云周榜在 hexo generate 时抓取，部署时更新
todo:
  enable: true
  bangumi_user: 'whatasiger'    # Bangumi 用户名
  netease_uid: '1929899165'     # 网易云音乐用户 ID（听歌排行需设为公开）

# Twikoo 评论系统
# 详细文档: https://twikoo.js.org/
twikoo:
  enable: true                                # 是否启用评论
  envId: 'https://comment.whatasiger.xyz'     # Twikoo 后端地址（Vercel 部署绑定的自定义域名）
  lang: 'zh-CN'                               # 界面语言
  # 以下版本请与 CDN 脚本版本保持一致，升级时同步修改
  jsUrl: 'https://cdn.jsdelivr.net/npm/twikoo@1.7.7/dist/twikoo.min.js'
