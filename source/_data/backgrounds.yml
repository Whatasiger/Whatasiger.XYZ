# 首页背景：首页右上角的按钮（顶栏导航收起时在导航卡片里）可在这几张之间切换，选择存在读者浏览器里
# 主题 _config.yml 的 background 即默认背景，须在其中（这里与它 src 相同的那一项）
# 凡是用主页背景的页面（首页、归档、独立页面、无封面的文章）都换成所选的那张；有封面的文章照旧用封面
