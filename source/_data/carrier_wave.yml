# CARRiER WAVE. 曲目表
# 正文放在 source/_carrier_wave/<slug>.md；文件不存在的篇目在目录中显示为「未接收」。
#
# slug   : 正文文件名与阅读页路径 /carrier_wave/<slug>/
# title  : 标题（不含系列序号）
# part   : 系列序号，可留空
# lead   : 主打篇目
# tint   : 该篇的色调（低饱和、高明度）
# flat   : 为 true 时载波被拉直，不再起伏
# wave   : 载波颜色，可留空（默认由 tint 推出）；暗色时整条载波变暗，阅读页进度点只照亮前后一小段

